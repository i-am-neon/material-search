name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      DEFAULT_RENDER_SERVICE_ID: srv-d8i45j58nd3s73e1u29g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy
        id: trigger
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY secret is required to deploy the Render API service." >&2
            exit 1
          fi
          SERVICE_ID="${RENDER_SERVICE_ID:-$DEFAULT_RENDER_SERVICE_ID}"
          python3 - "$SERVICE_ID" "$GITHUB_SHA" <<'PY'
          import json
          import os
          import sys
          import urllib.request

          service_id, commit_id = sys.argv[1:]
          token = os.environ["RENDER_API_KEY"]
          body = json.dumps({"commitId": commit_id, "clearCache": "do_not_clear"}).encode()
          request = urllib.request.Request(
              f"https://api.render.com/v1/services/{service_id}/deploys",
              data=body,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)

          deploy = payload.get("deploy") if isinstance(payload.get("deploy"), dict) else payload
          deploy_id = deploy.get("id")
          if not deploy_id:
              raise RuntimeError(f"Render did not return a deploy id: {payload}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"service_id={service_id}\n")
              output.write(f"deploy_id={deploy_id}\n")
          print(f"Triggered Render deploy {deploy_id} for service {service_id}")
          PY

      - name: Wait for Render deploy
        run: |
          python3 - "${{ steps.trigger.outputs.service_id }}" "${{ steps.trigger.outputs.deploy_id }}" <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          service_id, deploy_id = sys.argv[1:]
          token = os.environ["RENDER_API_KEY"]
          terminal_failures = {
              "build_failed",
              "canceled",
              "cancelled",
              "deactivated",
              "pre_deploy_failed",
              "update_failed",
          }
          for attempt in range(90):
              request = urllib.request.Request(
                  f"https://api.render.com/v1/services/{service_id}/deploys/{deploy_id}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              deploy = payload.get("deploy") if isinstance(payload.get("deploy"), dict) else payload
              status = deploy.get("status")
              print(f"Render deploy {deploy_id} status: {status}")
              if status == "live":
                  raise SystemExit(0)
              if status in terminal_failures:
                  raise SystemExit(f"Render deploy {deploy_id} failed with status {status}")
              time.sleep(20)
          raise SystemExit(f"Timed out waiting for Render deploy {deploy_id}")
          PY

      - name: Verify API health
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("https://material-search-api.onrender.com/healthz", timeout=90) as response:
              payload = json.load(response)
          if payload.get("status") != "ok":
              raise SystemExit(f"Unexpected health payload: {payload}")
          print("API health check passed")
          PY
