services:
  - type: web
    name: material-search-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install .
    startCommand: bash scripts/render-web.sh
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EMBEDDING_SERVICE_URL
        sync: false
      - key: SAM3_SERVICE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://i-am-neon.github.io
      - key: EMBEDDING_MODEL_ID
        value: google/siglip2-so400m-patch14-384
      - key: EMBEDDING_DIMENSIONS
        value: "1152"
      - key: CATALOG_IMAGE_BUCKET
        value: catalog-images
      - key: UPLOADED_IMAGE_BUCKET
        value: uploaded-images
      - key: GENERATED_ARTIFACT_BUCKET
        value: generated-artifacts
