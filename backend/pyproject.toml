[project]
name = "material-search-api"
version = "0.1.0"
description = "FastAPI, Dramatiq, and pgvector services for material catalog search."
requires-python = ">=3.11"
dependencies = [
  "dramatiq[redis]>=1.17.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
catalog-index-missing = "app.catalog.index_missing:main"
catalog-load-seed = "app.catalog.load_seed:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
