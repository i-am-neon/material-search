app = "material-search-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "Material Search API"
  ENVIRONMENT = "production"
  EMBEDDING_MODEL_ID = "google/siglip2-so400m-patch14-384"
  EMBEDDING_DIMENSIONS = "1152"
  CATALOG_IMAGE_BUCKET = "catalog-images"

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
  worker = "dramatiq app.workers.catalog_indexing app.workers.search_runs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["api"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]
