<html lang="en">

<meta charset="utf-8">

<title>Material Bank curated demo catalog gallery</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f3ee;
  --panel: #ffffff;
  --line: #ded8ce;
  --ink: #171717;
  --muted: #625d53;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(245, 243, 238, 0.94);
  backdrop-filter: blur(8px);
}
h1 {
  margin: 0 0 4px;
  font-size: 22px;
  line-height: 1.2;
}
p {
  margin: 0;
  color: var(--muted);
}
.controls {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(180px, 260px);
  gap: 10px;
  margin-top: 14px;
}
input,
select {
  width: 100%;
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font: inherit;
  padding: 8px 10px;
}
.summary {
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  padding: 20px 24px 32px;
}
.card {
  display: block;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: inherit;
  text-decoration: none;
}
.image-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1 / 1;
  background: #ebe6dc;
}
.image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.meta {
  padding: 12px;
}
.category {
  color: #766f63;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.name {
  margin-top: 5px;
  font-size: 15px;
  line-height: 1.25;
}
.manufacturer {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}
.rank {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}
@media (max-width: 640px) {
  header { padding: 16px; }
  .controls { grid-template-columns: 1fr; }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    padding: 16px;
  }
}
</style>
</head>

<script>
const items = JSON.parse(document.getElementById("items-data").textContent);
const grid = document.getElementById("grid");
const summary = document.getElementById("summary");
const search = document.getElementById("search");
const category = document.getElementById("category");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function render() {
  const query = search.value.trim().toLowerCase();
  const selectedCategory = category.value;
  const visibleItems = items.filter((item) => {
    const matchesCategory = !selectedCategory || item.category === selectedCategory;
    const matchesQuery = !query || item.searchText.includes(query);
    return matchesCategory && matchesQuery;
  });

  summary.textContent = `${visibleItems.length} visible of ${items.length} total`;
  grid.innerHTML = visibleItems.map((item) => `
    <a class="card"
       href="${escapeHtml(item.productUrl || item.imageUrl)}"
       target="_blank"
       rel="noreferrer">
      <div class="image-wrap">
        <img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" loading="lazy">
      </div>
      <div class="meta">
        <div class="category">${escapeHtml(item.category)}</div>
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="manufacturer">${escapeHtml(item.manufacturer)}</div>
        <div class="rank">Rank ${escapeHtml(item.rank || "-")} · ${escapeHtml(item.family)}</div>
      </div>
    </a>
  `).join("");
}

search.addEventListener("input", render);
category.addEventListener("change", render);
render();
</script>
</body>
</html>
